name: Publish to npm

on:
  release:
    types: [published]
  # Manual publish of whatever package.json version is on main. Used to publish a
  # release whose tag-time run failed (the tag's own workflow copy is what a
  # release re-run uses, so it cannot pick up a fixed publish.yml).
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # Authenticates via npm trusted publishing (OIDC, id-token: write above), so
      # there is no long-lived NPM_TOKEN to expire. Requires npm >= 11.5.1, which
      # the Node 24 runtime ships. Provenance is generated automatically.
      - run: npm publish --access public
